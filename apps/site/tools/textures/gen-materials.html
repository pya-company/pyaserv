<!doctype html><html><head><meta charset="utf8"><style>html,body{margin:0;background:#333}canvas{display:block;margin:4px}</style></head>
<body>
<canvas id="cork" width="480" height="480"></canvas>
<canvas id="paper" width="480" height="480"></canvas>
<canvas id="concrete" width="560" height="360"></canvas>
<script>
const NOISE = `
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p),f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y); }
float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<6;i++){ v+=a*noise(p); p*=2.03; a*=0.5;} return v; }
`;
const CORK = `precision highp float;varying vec2 vUv;uniform vec2 uRes;${NOISE}
void main(){ vec2 uv=vUv; float ar=uRes.x/uRes.y;
  float grain = fbm(uv*vec2(ar,1.0)*26.0);
  float speck = fbm(uv*300.0);
  float pores = smoothstep(0.60,0.92, fbm(uv*vec2(ar,1.0)*80.0+3.0));
  float big = fbm(uv*vec2(ar,1.0)*7.0+9.0);
  vec3 c = vec3(0.78,0.61,0.38);
  c = mix(c, vec3(0.66,0.49,0.28), grain*0.55);
  c = mix(c, vec3(0.83,0.70,0.48), big*0.18);
  c -= (speck-0.5)*0.16;
  c = mix(c, vec3(0.40,0.28,0.15), pores*0.55);
  gl_FragColor=vec4(c,1.0); }`;
const PAPER = `precision highp float;varying vec2 vUv;uniform vec2 uRes;${NOISE}
void main(){ vec2 uv=vUv;
  float fib = fbm(vec2(uv.x*430.0, uv.y*70.0));
  float blotch = fbm(uv*3.2+5.0);
  float grain = fbm(uv*180.0);
  vec3 c = vec3(0.965,0.94,0.885);
  c -= (fib-0.5)*0.04;
  c -= (grain-0.5)*0.03;
  c = mix(c, vec3(0.90,0.865,0.79), smoothstep(0.5,0.95,blotch)*0.35);
  float sp = step(0.9965, hash(uv*900.0)); c -= sp*0.18;
  gl_FragColor=vec4(c,1.0); }`;
const CONCRETE = `precision highp float;varying vec2 vUv;uniform vec2 uRes;${NOISE}
void main(){ vec2 uv=vUv; float ar=uRes.x/uRes.y;
  float mott = fbm(uv*vec2(ar,1.0)*9.0);
  float fine = fbm(uv*vec2(ar,1.0)*160.0);
  float stain = smoothstep(0.55,0.9, fbm(uv*vec2(ar,1.0)*4.0+2.0));
  vec3 c = vec3(0.80,0.785,0.76);
  c = mix(c, vec3(0.70,0.685,0.66), mott*0.5);
  c -= (fine-0.5)*0.06;
  c = mix(c, vec3(0.64,0.62,0.60), stain*0.3);
  float pit = step(0.994, hash(uv*700.0)); c -= pit*0.12;
  gl_FragColor=vec4(c,1.0); }`;

const VS=`attribute vec2 p;varying vec2 vUv;void main(){vUv=p*0.5+0.5;gl_Position=vec4(p,0.0,1.0);}`;
function render(id, fsrc, out){
  const cv=document.getElementById(id);
  const gl=cv.getContext('webgl',{premultipliedAlpha:false,antialias:true});
  const c=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))document.title='ERR '+id+':'+gl.getShaderInfoLog(o);return o;};
  const pr=gl.createProgram();gl.attachShader(pr,c(gl.VERTEX_SHADER,VS));gl.attachShader(pr,c(gl.FRAGMENT_SHADER,fsrc));gl.linkProgram(pr);gl.useProgram(pr);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
  gl.uniform2f(gl.getUniformLocation(pr,'uRes'),cv.width,cv.height);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  window[out]=cv.toDataURL('image/webp',0.88);
}
render('cork',CORK,'__cork');
render('paper',PAPER,'__paper');
render('concrete',CONCRETE,'__concrete');
if(!document.title.startsWith('ERR'))document.title='OK';
</script>
</body></html>
