<!doctype html><html><head><meta charset="utf8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body>
<canvas id="c" width="760" height="334"></canvas>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
varying vec2 vUv;
uniform vec2 uRes;

float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p),f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y); }
float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<6;i++){ v+=a*noise(p); p*=2.03; a*=0.5;} return v; }

void main(){
  vec2 uv = vUv;
  float aspect = uRes.x/uRes.y;

  // planks
  float N = 3.0;
  float py = uv.y*N;
  float pid = floor(py);
  float pf = fract(py);
  float r = hash(vec2(pid*1.7, 3.1));

  // sawn-plank grain: iso-bands run ALONG the plank (horizontal). Ring value
  // increases across the plank width (pf); gentle waviness + a couple cathedral
  // arches make it read as real timber, not marble/plywood.
  float along = uv.x*aspect;
  float across = pf;
  float wave = fbm(vec2(along*0.9, across*1.4) + r*6.0);          // slow undulation
  float arch = fbm(vec2(along*0.35, 1.0) + r*3.0);               // occasional cathedral arch
  float rings = across*8.0 + wave*2.2 + arch*3.0 + r*3.0;
  float g = abs(fract(rings)-0.5)*2.0;
  g = pow(g, 1.8);
  // long fibre streaks running down the length of the board
  float fibre = fbm(vec2(along*150.0, across*9.0));

  vec3 lightW = vec3(0.63,0.47,0.29);
  vec3 darkW  = vec3(0.31,0.19,0.095);
  vec3 col = mix(darkW, lightW, g);
  col += (r-0.5)*0.05;
  col -= (fibre-0.5)*0.10;

  // weathering: greyish wash in blotches
  float weath = fbm(uv*vec2(2.2,6.0)+11.0);
  col = mix(col, vec3(0.52,0.47,0.42), smoothstep(0.55,0.95,weath)*0.35);

  // knots (0-2 per plank)
  for(int k=0;k<2;k++){
    float kk=float(k);
    float present = step(0.55, hash(vec2(pid*2.3+kk*5.0, 9.0)));
    vec2 kc = vec2(0.15+0.7*hash(vec2(pid+kk*3.0,4.0)), 0.5);
    vec2 d = vec2((uv.x-kc.x)*aspect*1.1, pf-kc.y);
    float dd = length(d) + 0.12*fbm(d*10.0+kk);
    float body = 1.0-smoothstep(0.02,0.085,dd);
    float ring = abs(fract(dd*46.0)-0.5);
    vec3 knotCol = mix(vec3(0.14,0.075,0.035), vec3(0.30,0.17,0.08), ring);
    col = mix(col, knotCol, body*present);
  }

  // grooves between planks -> ambient occlusion dark line
  float groove = smoothstep(0.0,0.055,pf)*smoothstep(0.0,0.055,1.0-pf);
  col *= mix(0.5,1.0,groove);

  // lighting: soft top sheen + directional following grain
  col *= mix(1.06,0.88,uv.y);
  col += g*0.045;
  // gentle bevel highlight near top edge of each plank
  col += smoothstep(0.14,0.0,pf)*0.06;
  col -= smoothstep(0.86,1.0,pf)*0.05;

  // nails (2 per plank, metallic) — round via aspect corrected coords
  for(int s=0;s<2;s++){
    float sx = (s==0)?0.055:0.945;
    vec2 nd = vec2((uv.x-sx)*aspect, pf-0.5);
    float nl = length(nd);
    float head = 1.0-smoothstep(0.028,0.034,nl);
    float rim  = 1.0-smoothstep(0.034,0.04,nl);
    col = mix(col, vec3(0.10,0.08,0.06), rim*0.8);          // dark rim/hole shadow
    vec3 metal = mix(vec3(0.32,0.30,0.28), vec3(0.72,0.70,0.66), smoothstep(0.03,0.0,length(nd-vec2(-0.008,-0.008))));
    col = mix(col, metal, head);
  }

  // rough transparent silhouette (irregular plank ends + top/bottom)
  float rl = 0.012 + fbm(vec2(uv.y*15.0, 2.0))*0.02;
  float rr = 0.988 - fbm(vec2(uv.y*15.0, 8.0))*0.02;
  float rt = 0.02 + fbm(vec2(uv.x*14.0, 5.0))*0.02;
  float rb = 0.98 - fbm(vec2(uv.x*14.0, 6.0))*0.02;
  float a = smoothstep(rl-0.006,rl+0.01,uv.x)*smoothstep(rr+0.006,rr-0.01,uv.x)
          * smoothstep(rt-0.006,rt+0.01,uv.y)*smoothstep(rb+0.006,rb-0.01,uv.y);
  // darken extreme edges (worn)
  col *= mix(0.7,1.0, smoothstep(rl,rl+0.05,uv.x)*smoothstep(rr,rr-0.05,uv.x));

  gl_FragColor = vec4(col, a);
}
</script>
<script>
const cv=document.getElementById('c');
const gl=cv.getContext('webgl',{premultipliedAlpha:false,antialias:true});
const vs=`attribute vec2 p;varying vec2 vUv;void main(){vUv=p*0.5+0.5;gl_Position=vec4(p,0.0,1.0);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))document.title='ERR:'+gl.getShaderInfoLog(o);return o;}
const pr=gl.createProgram();
gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent));
gl.linkProgram(pr);gl.useProgram(pr);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
gl.uniform2f(gl.getUniformLocation(pr,'uRes'),cv.width,cv.height);
gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
window.__png=cv.toDataURL('image/png');
window.__webp=cv.toDataURL('image/webp',0.9);
if(!document.title.startsWith('ERR'))document.title='OK';
</script>
</body></html>
